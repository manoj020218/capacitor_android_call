<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>NativeCall Example</title>
    <style>
      body { font-family: -apple-system, Roboto, sans-serif; padding: 24px; }
      button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
      #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #111; color: #0f0; padding: 12px; margin-top: 16px; height: 240px; overflow-y: auto; }
    </style>
  </head>
  <body>
    <h2>capacitor-native-call — manual test harness</h2>
    <button id="init">initialize()</button>
    <button id="check-perm">checkFullScreenIntentPermission()</button>
    <button id="request-perm">requestFullScreenIntentPermission()</button>
    <button id="set-ringtone">setRingtone('chime')</button>
    <button id="stop-ringing">stopRinging(callId prompt)</button>
    <div id="log"></div>
    <script type="importmap">
      {
        "imports": {
          "@capacitor/core": "./vendor/capacitor-core/index.js",
          "capacitor-native-call": "./vendor/capacitor-native-call/index.js"
        }
      }
    </script>
    <script type="module" src="index.js"></script>
  </body>
</html>
